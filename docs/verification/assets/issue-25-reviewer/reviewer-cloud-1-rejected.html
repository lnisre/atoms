<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文计数器</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f4f5f7;
    color: #1f2328;
  }
  .card {
    background: #ffffff;
    padding: 32px 28px;
    border-radius: 14px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.10);
    text-align: center;
    min-width: 260px;
  }
  h1 {
    margin: 0 0 18px;
    font-size: 20px;
    font-weight: 600;
  }
  output {
    display: block;
    font-size: 56px;
    font-weight: 700;
    line-height: 1.1;
    padding: 8px 0 20px;
    font-variant-numeric: tabular-nums;
  }
  .buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button {
    font: inherit;
    font-size: 16px;
    padding: 10px 18px;
    border-radius: 8px;
    border: 1px solid #d0d7de;
    background: #f6f8fa;
    color: #1f2328;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: #eaeef2; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  [data-atoms-status] {
    margin-top: 18px;
    font-size: 13px;
    color: #57606a;
    min-height: 1em;
  }
</style>
</head>
<body>
  <main class="card">
    <h1>中文计数器</h1>
    <output id="counter" aria-live="polite">0</output>
    <div class="buttons">
      <button id="btn-inc" type="button" disabled>增加</button>
      <button id="btn-dec" type="button" disabled>减少</button>
      <button id="btn-reset" type="button" disabled>重置</button>
    </div>
    <div data-atoms-status></div>
  </main>
<script>
(function () {
  "use strict";

  var outEl = document.getElementById("counter");
  var statusEl = document.querySelector("[data-atoms-status]");
  var btnInc = document.getElementById("btn-inc");
  var btnDec = document.getElementById("btn-dec");
  var btnReset = document.getElementById("btn-reset");
  var buttons = [btnInc, btnDec, btnReset];

  // 业务状态
  var count = 0;
  var version = 1;
  var loaded = false;

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function setButtonsDisabled(disabled) {
    for (var i = 0; i < buttons.length; i++) {
      buttons[i].disabled = disabled;
    }
  }

  function render() {
    outEl.textContent = String(count);
  }

  function isValidInteger(v) {
    return typeof v === "number" && isFinite(v) && Math.floor(v) === v;
  }

  function isValidFiniteNumber(v) {
    return typeof v === "number" && isFinite(v);
  }

  // 统一保存流程：返回 Promise，调用方在事件处理器内同步发起
  function persist(nextCount, prevCount) {
    count = nextCount;
    render();
    setStatus("正在保存");
    setButtonsDisabled(true);

    var data = { count: count, version: version };

    var p;
    try {
      p = window.atoms.saveState(data);
    } catch (e) {
      p = Promise.reject(e);
    }

    return Promise.resolve(p).then(function () {
      setStatus("已保存");
      setButtonsDisabled(false);
    }, function () {
      count = prevCount;
      render();
      setStatus("保存失败");
      setButtonsDisabled(false);
    });
  }

  function commit(delta) {
    if (!loaded) return;
    var prevCount = count;
    var nextCount = delta === null ? 0 : count + delta;
    // 事件处理器内同步调用 saveState（persist 内部同步发起）
    persist(nextCount, prevCount);
  }

  btnInc.addEventListener("click", function () { commit(1); });
  btnDec.addEventListener("click", function () { commit(-1); });
  btnReset.addEventListener("click", function () { commit(null); });

  // 初始化：控件保持 disabled 直到 load 解析完成
  setButtonsDisabled(true);
  setStatus("");
  render();

  var loadPromise;
  try {
    loadPromise = window.atoms.loadState();
  } catch (e) {
    loadPromise = Promise.reject(e);
  }

  Promise.resolve(loadPromise).then(function (data) {
    if (data === null || data === undefined) {
      // 全新数据
      count = 0;
      version = 1;
    } else if (typeof data === "object") {
      count = isValidInteger(data.count) ? data.count : 0;
      version = isValidFiniteNumber(data.version) ? data.version : 1;
    } else {
      count = 0;
      version = 1;
    }
    loaded = true;
    render();
    setStatus("已读取");
    setButtonsDisabled(false);
  }, function () {
    loaded = false;
    render();
    setStatus("读取失败");
    setButtonsDisabled(true);
  });
})();
</script>
</body>
</html>
