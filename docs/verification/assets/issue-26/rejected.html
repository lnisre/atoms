<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中文计数器</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f2f4f8;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #1f2933;
    padding: 16px;
  }
  .card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 8px 28px rgba(15, 23, 42, 0.12);
    padding: 28px 26px 22px;
    width: 100%;
    max-width: 360px;
    text-align: center;
  }
  h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0 0 16px;
    letter-spacing: 1px;
    color: #334155;
  }
  output {
    display: block;
    font-size: 64px;
    font-weight: 700;
    line-height: 1.1;
    margin: 8px 0 22px;
    font-variant-numeric: tabular-nums;
    color: #0f172a;
    word-break: break-all;
  }
  .buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  button {
    flex: 1 1 0;
    font-size: 16px;
    padding: 12px 8px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    color: #ffffff;
    background: #2563eb;
    transition: background 0.15s ease, opacity 0.15s ease;
    font-family: inherit;
  }
  button:nth-child(2) { background: #dc2626; }
  button:nth-child(3) { background: #64748b; }
  button:hover:not(:disabled) { filter: brightness(1.08); }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
  [data-atoms-status] {
    margin-top: 18px;
    font-size: 13px;
    min-height: 18px;
    color: #475569;
  }
  [data-atoms-status][data-state="error"] { color: #b91c1c; }
</style>
</head>
<body>
  <main class="card">
    <h1>中文计数器</h1>
    <output id="countDisplay" aria-live="polite">0</output>
    <div class="buttons">
      <button id="btnInc" type="button" disabled>增加</button>
      <button id="btnDec" type="button" disabled>减少</button>
      <button id="btnReset" type="button" disabled>重置</button>
    </div>
    <div data-atoms-status id="status" role="status" aria-live="polite"></div>
  </main>

<script>
(function () {
  "use strict";

  var outputEl = document.getElementById("countDisplay");
  var statusEl = document.getElementById("status");
  var btnInc = document.getElementById("btnInc");
  var btnDec = document.getElementById("btnDec");
  var btnReset = document.getElementById("btnReset");
  var allButtons = [btnInc, btnDec, btnReset];

  // 当前完整状态对象（保留未知字段）
  var currentState = null;
  // 是否已完成初始加载
  var ready = false;
  // 是否处于保存中（避免并发保存导致状态错乱）
  var saving = false;

  function setStatus(text, isError) {
    statusEl.textContent = text;
    if (isError) {
      statusEl.setAttribute("data-state", "error");
    } else {
      statusEl.removeAttribute("data-state");
    }
  }

  function setButtonsEnabled(enabled) {
    for (var i = 0; i < allButtons.length; i++) {
      allButtons[i].disabled = !enabled;
    }
  }

  function isFiniteNumber(v) {
    return typeof v === "number" && isFinite(v);
  }

  // 规范化：返回一个保留全部未知字段、并把 count 处理为有限数的副本
  function normalizeState(raw) {
    var next;
    if (raw && typeof raw === "object" && !Array.isArray(raw)) {
      next = {};
      for (var k in raw) {
        if (Object.prototype.hasOwnProperty.call(raw, k)) {
          next[k] = raw[k];
        }
      }
    } else {
      next = {};
    }
    if (!isFiniteNumber(next.count)) {
      next.count = 0;
    }
    return next;
  }

  function renderCount() {
    var v = currentState && isFiniteNumber(currentState.count) ? currentState.count : 0;
    outputEl.textContent = String(v);
  }

  function loadInitial() {
    var p;
    try {
      p = window.atoms.loadState();
    } catch (err) {
      ready = false;
      setButtonsEnabled(false);
      setStatus("读取失败", true);
      return;
    }
    Promise.resolve(p).then(function (data) {
      if (data === null || data === undefined) {
        // null 表示全新数据
        currentState = { count: 0 };
      } else {
        // 保留未知字段，仅内存中规范化 count
        currentState = normalizeState(data);
      }
      ready = true;
      renderCount();
      setStatus("已读取", false);
      setButtonsEnabled(true);
    }, function () {
      ready = false;
      setButtonsEnabled(false);
      setStatus("读取失败", true);
    });
  }

  // 执行一次变更：在完整状态副本上修改 count，同步调用 saveState
  function mutate(fn) {
    if (!ready || saving) {
      return;
    }
    var nextState = normalizeState(currentState);
    fn(nextState);
    if (!isFiniteNumber(nextState.count)) {
      nextState.count = 0;
    }

    var prevState = currentState;
    // 乐观先前展示？为满足契约：保存成功后再提交
    saving = true;
    setButtonsEnabled(false);
    setStatus("正在保存", false);

    var p;
    try {
      p = Promise.resolve(nextState);
    } catch (err) {
      saving = false;
      currentState = prevState;
      renderCount();
      setStatus("保存失败", true);
      setButtonsEnabled(true);
      return;
    }

    Promise.resolve(p).then(function () {
      currentState = nextState;
      saving = false;
      renderCount();
      setStatus("已保存", false);
      setButtonsEnabled(true);
    }, function () {
      // 失败：恢复完整的前一状态
      currentState = prevState;
      saving = false;
      renderCount();
      setStatus("保存失败", true);
      setButtonsEnabled(true);
    });
  }

  btnInc.addEventListener("click", function () {
    mutate(function (s) { s.count = (isFiniteNumber(s.count) ? s.count : 0) + 1; });
  });
  btnDec.addEventListener("click", function () {
    mutate(function (s) { s.count = (isFiniteNumber(s.count) ? s.count : 0) - 1; });
  });
  btnReset.addEventListener("click", function () {
    mutate(function (s) { s.count = 0; });
  });

  // 初始禁用所有按钮
  setButtonsEnabled(false);
  loadInitial();
})();
</script>
</body>
</html>
