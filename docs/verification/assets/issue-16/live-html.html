<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生成记录验收计数器</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: #ffffff;
    color: #1a1a1a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  h1 {
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 28px;
    color: #1a1a1a;
  }
  .count-box {
    border: 1px solid #dbe5f3;
    border-radius: 12px;
    padding: 28px 16px;
    margin-bottom: 24px;
    background: #f7faff;
  }
  .count-label {
    display: block;
    font-size: 0.85rem;
    color: #5a6b85;
    margin-bottom: 8px;
  }
  #countValue {
    display: block;
    font-size: 3rem;
    font-weight: 700;
    line-height: 1.1;
    color: #1560d6;
    font-variant-numeric: tabular-nums;
  }
  .buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 18px;
  }
  button {
    font-family: inherit;
    font-size: 1rem;
    padding: 12px 26px;
    border-radius: 8px;
    cursor: pointer;
    border: 1px solid #1560d6;
    background: #1560d6;
    color: #ffffff;
    transition: background 0.15s ease, opacity 0.15s ease;
    min-width: 120px;
  }
  button:hover:not(:disabled) { background: #0f4daf; border-color: #0f4daf; }
  button:active:not(:disabled) { background: #0c3f8f; }
  button:focus-visible { outline: 3px solid #9ec3f5; outline-offset: 2px; }
  button.secondary {
    background: #ffffff;
    color: #1560d6;
    border-color: #1560d6;
  }
  button.secondary:hover:not(:disabled) { background: #eef4ff; }
  button.secondary:active:not(:disabled) { background: #dde9ff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .status {
    font-size: 0.85rem;
    min-height: 1.2em;
    color: #5a6b85;
  }
  .status.error { color: #c02626; font-weight: 600; }
  .status.saved { color: #1d7a3a; }
  .hint {
    margin-top: 22px;
    font-size: 0.78rem;
    color: #8a97ab;
    line-height: 1.5;
  }
</style>
</head>
<body>
<main class="app">
  <h1>生成记录验收计数器</h1>

  <div class="count-box">
    <span class="count-label">当前次数</span>
    <output id="countValue" aria-live="polite">0</output>
  </div>

  <div class="buttons">
    <button type="button" id="incBtn" disabled>增加一次</button>
    <button type="button" id="resetBtn" class="secondary" disabled>归零</button>
  </div>

  <p class="status" id="status" role="status" aria-live="polite">正在加载…</p>

  <p class="hint">数据通过平台 atoms 自动保存到本浏览器和本站点。刷新后会自动恢复；清除站点数据后将无法找回。</p>
</main>

<script>
(function () {
  "use strict";

  var countEl = document.getElementById("countValue");
  var incBtn = document.getElementById("incBtn");
  var resetBtn = document.getElementById("resetBtn");
  var statusEl = document.getElementById("status");

  var state = { count: 0 };
  var ready = false;

  function render() {
    countEl.textContent = String(state.count);
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "status" + (cls ? " " + cls : "");
  }

  function setEnabled(on) {
    incBtn.disabled = !on;
    resetBtn.disabled = !on;
  }

  function normalize(raw) {
    if (raw && typeof raw === "object" && !Array.isArray(raw)) {
      var n = raw.count;
      if (typeof n === "number" && isFinite(n) && n >= 0 && Math.floor(n) === n) {
        return { count: n };
      }
    }
    return { count: 0 };
  }

  function mutate(nextState) {
    if (!ready) return;
    state = nextState;
    render();
    setEnabled(false);
    setStatus("正在保存…", "");

    var snapshot = { count: state.count };
    var payload;
    try {
      payload = JSON.parse(JSON.stringify(snapshot));
    } catch (e) {
      setStatus("保存失败：数据无法序列化。", "error");
      setEnabled(true);
      return;
    }

    window.atoms.saveState(payload).then(function () {
      setStatus("已保存", "saved");
      setEnabled(true);
    }, function () {
      setStatus("保存失败，本次操作未保存，请重试。", "error");
      setEnabled(true);
    });
  }

  incBtn.addEventListener("click", function () {
    mutate({ count: state.count + 1 });
  });

  resetBtn.addEventListener("click", function () {
    mutate({ count: 0 });
  });

  function start() {
    if (!window.atoms || typeof window.atoms.loadState !== "function" || typeof window.atoms.saveState !== "function") {
      setStatus("保存服务不可用，编辑已禁用。", "error");
      setEnabled(false);
      return;
    }

    window.atoms.loadState().then(function (saved) {
      if (saved === null || typeof saved === "undefined") {
        state = { count: 0 };
        setStatus("已就绪，可开始计数。", "");
      } else {
        state = normalize(saved);
        setStatus("已恢复上次保存的数据。", "");
      }
      ready = true;
      render();
      setEnabled(true);
    }, function () {
      setStatus("读取已保存数据失败，编辑已禁用，以免覆盖原数据。", "error");
      setEnabled(false);
    });
  }

  render();
  setEnabled(false);
  start();
})();
</script>
</body>
</html>
